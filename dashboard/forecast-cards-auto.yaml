{#-
  Load Insights - live forecast-vs-actual cards, one per thing it forecasts.

  This is a CARD, not a generator: paste the whole thing into a dashboard as a
  manual card and it rebuilds itself whenever the Energy dashboard gains or
  loses a device. Nothing to re-run.

  Needs two cards from HACS:
    * auto-entities   (github.com/thomasloven/lovelace-auto-entities)
    * Plotly Graph Card (github.com/dbuezas/lovelace-plotly-graph-card)

  `card_param: cards` is what makes auto-entities fill a vertical-stack's
  cards instead of an entity list, so each generated item is a full card.

  Window: 36 hours back, 36 forward.
-#}
type: custom:auto-entities
card:
  type: vertical-stack
card_param: cards
filter:
  template: |
    {%- set sensors = states.sensor
          | selectattr('attributes.detailedForecast', 'defined')
          | rejectattr('state', 'in', ['unavailable', 'unknown'])
          | sort(attribute='name') | list -%}
    {#- drop the words every name shares, so titles read "Boiler" -#}
    {%- set ns = namespace(prefix=[], hits=0, cards=[]) -%}
    {%- if sensors | count > 1 -%}
      {%- set first = sensors[0].name.split(' ') -%}
      {%- for i in range(first | count) -%}
        {%- set cand = (ns.prefix + [first[i]]) | join(' ') + ' ' -%}
        {%- set ns.hits = 0 -%}
        {%- for n in sensors | map(attribute='name') -%}
          {%- if n.startswith(cand) -%}{%- set ns.hits = ns.hits + 1 -%}{%- endif -%}
        {%- endfor -%}
        {%- if ns.hits == (sensors | count) -%}{%- set ns.prefix = ns.prefix + [first[i]] -%}{%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {%- set prefix = (ns.prefix | join(' ') + ' ') if ns.prefix else '' -%}
    {%- for s in sensors -%}
      {%- set e = s.entity_id -%}
      {%- set band = '({hass}) => {const r = hass.states["' ~ e ~ '"].attributes.detailedForecast || []; return {xs: r.map(p => new Date(p.period_start)), ys: r.map(p => p.KEY ?? p.kwh)};}' -%}
      {%- set line = '({hass}) => {const r = hass.states["' ~ e ~ '"].attributes.detailedForecast || []; return {xs: r.map(p => new Date(p.period_start)), ys: r.map(p => p.kwh)};}' -%}
      {%- set hist = '({hass}) => {const r = hass.states["' ~ e ~ '"].attributes.history || []; return {xs: r.map(p => new Date(p.period_start)), ys: r.map(p => p.kwh)};}' -%}
      {%- set ns.cards = ns.cards + [{
            'type': 'custom:plotly-graph',
            'title': (s.name | replace(prefix, '', 1) | replace(' forecast', '') | replace(' Forecast', '')) | trim | capitalize,
            'hours_to_show': 72,
            'time_offset': '36h',
            'refresh_interval': 300,
            'layout': {'height': 260,
                       'margin': {'t': 30, 'l': 50, 'r': 12, 'b': 30},
                       'legend': {'orientation': 'h', 'y': 1.15},
                       'yaxis': {'title': 'kWh / h', 'rangemode': 'tozero'}},
            'entities': [
              {'entity': e, 'name': 'Likely range', 'showlegend': false, 'hoverinfo': 'skip',
               'line': {'width': 0}, 'filters': [{'fn': band | replace('KEY', 'kwh_p10')}]},
              {'entity': e, 'name': 'Likely range', 'fill': 'tonexty', 'hoverinfo': 'skip',
               'fillcolor': 'rgba(130,130,190,0.18)', 'line': {'width': 0},
               'filters': [{'fn': band | replace('KEY', 'kwh_p90')}]},
              {'entity': e, 'name': 'Forecast', 'line': {'width': 2, 'dash': 'dot'},
               'filters': [{'fn': line}]},
              {'entity': e, 'name': 'Actual', 'type': 'bar',
               'marker': {'color': 'rgba(120,170,120,0.65)'}, 'filters': [{'fn': hist}]},
            ],
          }] -%}
    {%- endfor -%}
    {{ ns.cards | tojson }}
