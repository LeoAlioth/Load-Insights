reset_detection:
  name: Reset load detection
  description: >-
    Forget every detected signature and start the meter's backfill again.
    For when the meter changed, or a phase was rewired, and the library
    describes a site that no longer exists. Names you have given are kept
    and handed back to whatever the backfill finds that looks like them -
    so where the site really has changed, and nothing matches, a name
    simply does not return - unless you ask for the names to go too.
  fields:
    forget_names:
      name: Forget the names too
      description: >-
        Drop the names as well as the library, so nothing learned before
        - not even a name waiting to find its load - carries over. Name the
        loads anew once the backfill has run.
      required: false
      default: false
      selector:
        boolean:

name_load:
  name: Name a load
  description: >-
    Give a detected load a name by its id - the one each load carries in the
    diagnostics - or clear it with an empty name. For a load the naming page
    does not offer yet: it only lists loads that have repeated tightly
    enough, and a load whose runs vary a lot can wait a long time.
  fields:
    load_id:
      name: Load
      description: The detected load's id, as the diagnostics give it.
      required: true
      selector:
        number:
          min: 0
          mode: box
    meter:
      name: Meter
      description: >-
        For a load a meter holding several devices saw - its own detector's
        id, as the detected loads sensor lists it under that meter (Mansarda's
        #11). Empty for one the grid saw.
      required: false
      selector:
        text:
    name:
      name: Name
      description: What to call it. Loads given the same name are one device. Empty clears the name.
      required: false
      selector:
        text:

backfill_statistics:
  # its name and description are the translations' (translations/*.json)
  fields:
    name:
      required: false
      selector:
        text:
